<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triagem de pacientes</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/dialog.css">
    <link rel="stylesheet" href="style/menu.css">
</head>
<body>
    <header>
        <section class="left">
            <button id="add-new" class="primary">Novo diagnostico</button>
            <button class="icon"><svg><use href="/media/icon/symbolic.svg#chevron-right"></use></svg></button>
        </section>
        <section class="right">
            <button class="icon" id="main-menu-button" onmousedown="menu.open('menu/main.menu.html', 'main-menu-button', menu.position.topRight)"><svg><use href="/media/icon/symbolic.svg#menu"></use></svg></button>
        </section>
    </header>

    <main>
        <div class="left">
            <h1>Aguardando atendimento</h1>
            <section class="content" id="queue">
                <section id="emergency">
                    <h2>Emergência</h2>
                    <div class="cases"></div>
                </section>
                <section id="very-urgent">
                    <h2>Muito urgente</h2>
                    <div class="cases"></div>
                </section>
                <section id="urgent">
                    <h2>Urgente</h2>
                    <div class="cases"></div>
                </section>
                <section id="slightly-urgent">
                    <h2>Pouco urgente</h2>
                    <div class="cases"></div>
                </section>
                <section id="not-urgent">
                    <h2>Não urgente</h2>
                    <div class="cases"></div>
                </section>
                <p class="empty" id="queue-empty">Nenhum paciente aguardando atendimento.</p>
            </section>
        </div>
        <div class="right">
            <h1>Em atendimento</h1>
            <section class="content">
                <section id="attending">
                    <section id="attending-emergency">
                        <h2>Emergência</h2>
                        <div class="cases"></div>
                    </section>
                    <section id="attending-very-urgent">
                        <h2>Muito urgente</h2>
                        <div class="cases"></div>
                    </section>
                    <section id="attending-urgent">
                        <h2>Urgente</h2>
                        <div class="cases"></div>
                    </section>
                    <section id="attending-slightly-urgent">
                        <h2>Pouco urgente</h2>
                        <div class="cases"></div>
                    </section>
                    <section id="attending-not-urgent">
                        <h2>Não urgente</h2>
                        <div class="cases"></div>
                    </section>
                </section>
                <p class="empty" id="attending-empty">Nenhum paciente em atendimento.</p>
            </section>
        </div>
    </main>

    <script type="module" src="script/app.js"></script>
</body>
</html>
