<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triagem de pacientes</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/dialog.css">
</head>
<body>
    <header>
        <section class="left">
            <h3>Centro de Triagem</h3>
        </section>
        <section class="right">
            <button id="add-new" class="primary">Novo diagnostico</button>
        </section>
    </header>

    <main>
        <div class="left">
            <h1>Aguardando atendimento</h1>
            <section class="content">
                <section id="emergency">
                    <h2>Emergência</h2>
                    <div class="cases">
                        <div class="case">
                            <div class="case-right">
                                <div class="status emergency"></div>
                                <div>
                                    <h4>Nome paciente</h4>
                                    <p>Condições</p>
                                </div>
                            </div>
                            <div class="case-left">
                                <button>Atender</button>
                            </div>
                        </div>
                    </div>
                </section>
                <section id="very-urgent">
                    <h2>Muito urgente</h2>
                    <div class="cases">
                        <div class="case">
                            <div class="case-right">
                                <div class="status very-urgent"></div>
                                <div>
                                    <h4>Nome paciente</h4>
                                    <p>Condições</p>
                                </div>
                            </div>
                            <div class="case-left">
                                <button>Atender</button>
                            </div>
                        </div>
                    </div>
                </section>
                <section id="urgent">
                    <h2>Urgente</h2>
                    <div class="cases">
                        <div class="case">
                            <div class="case-right">
                                <div class="status urgent"></div>
                                <div>
                                    <h4>Nome paciente</h4>
                                    <p>Condições</p>
                                </div>
                            </div>
                            <div class="case-left">
                                <button>Atender</button>
                            </div>
                        </div>
                    </div>
                </section>
                <section id="slightly-urgent">
                    <h2>Pouco urgente</h2>
                    <div class="cases">
                        <div class="case">
                            <div class="case-right">
                                <div class="status slightly-urgent"></div>
                                <div>
                                    <h4>Nome paciente</h4>
                                    <p>Condições</p>
                                </div>
                            </div>
                            <div class="case-left">
                                <button>Atender</button>
                            </div>
                        </div>
                        <div class="case">
                            <div class="case-right">
                                <div class="status slightly-urgent"></div>
                                <div>
                                    <h4>Nome paciente</h4>
                                    <p>Condições</p>
                                </div>
                            </div>
                            <div class="case-left">
                                <button>Atender</button>
                            </div>
                        </div>
                    </div>
                </section>
                <section id="not-urgent">
                    <h2>Não urgente</h2>
                    <div class="cases">
                        <div class="case">
                            <div class="case-right">
                                <div class="status not-urgent"></div>
                                <div>
                                    <h4>Nome paciente</h4>
                                    <p>Condições</p>
                                </div>
                            </div>
                            <div class="case-left">
                                <button>Atender</button>
                            </div>
                        </div>
                    </div>
                </section>
            </section>
        </div>
        <div class="right">
            <h1>Em atendimento</h1>
            <section class="content">
                <section id="attending">

                </section>
            </section>
        </div>
    </main>

    <script type="module" src="script/app.js"></script>
</body>
</html>
