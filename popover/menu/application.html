<!DOCTYPE html>

<!--
# Main menu
Exemplo de menu de ações da aplicação, com um submenu declarado inline.
-->

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu principal</title>
</head>
<body>
    <button type="button" data-menu-return="null" onmouseup="dialog.showFile('./popover/dialog/newTicket.html')">
        <span>Novo diagnóstico</span>
        <span class="menu-shortcut">Ctrl+N</span>
    </button>

    <button type="button" data-submenu="#theme-menu">
        <span>Tema</span>
    </button>

    <template id="theme-menu">
        <button type="button" class="theme-light" data-theme="light">
            <span>Claro</span>
        </button>

        <button type="button" class="theme-dark" data-theme="dark">
            <span>Escuro</span>
        </button>

        <script>
            (() => {
                const menuElement = window.menuElement();

                menuElement.querySelectorAll("[data-theme]").forEach((button) => {
                    button.addEventListener("menuactivate", () => {
                        const theme = button.dataset.theme;

                        storage.set('theme', theme);

                        document.body.classList.remove("light", "dark");
                        document.body.classList.add(theme);

                        window.menuReturn(theme);
                    });
                });
            })();
        </script>
    </template>

    <hr>

    <button type="button" data-menu-return="null" onmouseup="dialog.showFile('./popover/dialog/preferences.html')">
        <span>Preferências</span>
        <span class="menu-shortcut">Ctrl+,</span>
    </button>

    <button type="button" data-menu-return="keyboard-shortcuts">
        <span>Atalhos de teclado</span>
        <span class="menu-shortcut">Ctrl+?</span>
    </button>

    <button type="button" data-menu-return="about">
        <span>Sobre o PI2</span>
    </button>
</body>
</html>
